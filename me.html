<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>리턴투미 내 매칭</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 개인 매칭 페이지(me.html#토큰): 연분홍 바탕 + 둥근 흰 카드(그림자) + 분홍→빨강 그라데이션 알약 버튼 + 큰 그림 이모지. 진행 중 매칭 → 나를 고른 분 → 추천 → 내 카드 순 */
:root{
  color-scheme:light;
  --bg:#FFF8F9; --ink:#1F1A24; --muted:#8E8590; --rose:#EE5F84; --rose-dk:#D94468; --blush:#FCE3E9;
  --gold:#F5A623; --paper:#FFFFFF; --line:rgba(31,26,36,.08); --ok:#1F9D63; --ok-bg:#E3F7EC;
  --grad:linear-gradient(90deg,#EE5F84,#FF8A73);
  --shadow:0 14px 34px rgba(220,80,110,.12),0 2px 6px rgba(220,80,110,.06);
  --display:"Gowun Dodum","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#FFFFFF 0%,#FFF6F7 100%) fixed;background-color:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;word-break:keep-all}
.page{max-width:420px;margin:0 auto;padding-block:40px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
header{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
header .script{width:84px;height:84px}
h1{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.3;letter-spacing:-.02em;margin:0}
h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.01em;margin:0 4px}
/* 소제목(추천·나에게 관심 보낸 분·매칭된 분): 신청서 "가볍게"와 같은 분홍 형광펜 밑줄 */
section>h2{align-self:flex-start;font-size:20px;margin:0 2px;padding:0 4px;background:linear-gradient(transparent 58%,#FBD6E0 58%,#FBD6E0 92%,transparent 92%)}
p{margin:0}
.muted{color:var(--muted);font-size:14px}
section{display:flex;flex-direction:column;gap:14px}
#view{display:flex;flex-direction:column;gap:32px}
.box{background:var(--paper);border-radius:28px;padding:24px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
/* 나에게 관심 보낸 분 카드: 테두리 선·둘레 빛·하트 구슬이 같은 박자(2.4초, 부드러운 쿵-쿵 뒤 쉼)로 함께 두근. 박자 지점(16%·44%)을 두 키프레임에서 똑같이 맞춤 */
.box.hot{position:relative;border:1.5px solid #F6BFCD;animation:hotpulse 2.4s cubic-bezier(.45,0,.55,1) infinite}
@keyframes hotpulse{
  0%,72%,100%{border-color:#F6BFCD;box-shadow:0 0 0 0 rgba(238,95,132,0),var(--shadow)}
  16%{border-color:#F197AD;box-shadow:0 0 0 6px rgba(238,95,132,.11),var(--shadow)}
  30%{border-color:#F5B4C4;box-shadow:0 0 0 3px rgba(238,95,132,.04),var(--shadow)}
  44%{border-color:#F3A3B7;box-shadow:0 0 0 7px rgba(238,95,132,.08),var(--shadow)}}
.box.hot::after{content:"\2665";position:absolute;top:-14px;right:-8px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:17px;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.75),transparent 40%),var(--grad);box-shadow:0 6px 12px rgba(238,95,132,.3);animation:heartbeat 2.4s cubic-bezier(.45,0,.55,1) infinite}
@keyframes heartbeat{0%,72%,100%{transform:rotate(12deg) scale(1)}16%{transform:rotate(12deg) scale(1.09)}30%{transform:rotate(12deg) scale(1.01)}44%{transform:rotate(12deg) scale(1.05)}}
/* 매칭된 짝 카드: 이름 뒤 빛 번짐 + 떠오르는 작은 하트 (4.5초마다 한 번, 차분하게) */
.box.mate{position:relative;overflow:hidden;isolation:isolate;border:1.5px solid #F6BFCD}
.box.mate>*{position:relative;z-index:2}
.box.mate>.fx{position:absolute;inset:0;z-index:1;pointer-events:none}
.mate .fx i{position:absolute;display:block;font-style:normal;line-height:1;left:var(--cx,50%);top:var(--cy,22%)}
.mate .glow{width:240px;height:140px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,170,190,.45),rgba(255,200,170,.18) 60%,transparent);animation:bloom 4.5s ease-in-out infinite}
@keyframes bloom{0%,100%{transform:translate(-50%,-50%) scale(.6);opacity:0}40%{transform:translate(-50%,-50%) scale(1);opacity:1}}
.mate .ht{color:var(--c);font-size:var(--s);opacity:0;animation:heartup 4.5s ease-out var(--w) infinite}
@keyframes heartup{0%,10%{transform:translate(-50%,-50%) scale(.5);opacity:0}35%{opacity:.95}75%,100%{transform:translate(-50%,calc(-50% - 34px)) scale(1);opacity:0}}
.passnote{margin:-2px 0 0;text-align:center;font-size:12px;color:var(--muted);white-space:pre-line}
.daily{margin:2px 0 0;text-align:center;font-size:12px;color:var(--muted)}
.cheer{text-align:center;font-size:14px;font-weight:700;color:var(--rose-dk)}
@media (prefers-reduced-motion:reduce){.mate .fx i{animation:none}.mate .ht{opacity:0}.mate .glow{opacity:.8;transform:translate(-50%,-50%)}}
@media (prefers-reduced-motion:reduce){.box.hot{animation:none}.box.hot::after{animation:none;transform:rotate(12deg)}}
.notice{background:var(--paper);border-radius:28px;padding:24px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:14px;font-size:15px}
.notice .ico{width:96px;height:96px}
/* 안내 카드 위 구슬: 로즈→코랄 그라데이션에 빛 반사, 천천히 둥실 */
.orb{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.75),transparent 40%),var(--grad);box-shadow:0 10px 20px rgba(220,80,110,.22);animation:orbfloat 3.4s ease-in-out infinite}
@keyframes orbfloat{50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.orb{animation:none}}
/* 3D 아이콘: 처음엔 톡 튀어나오고, 그다음 둥실둥실. 하트는 두근, 반짝이는 깜빡, 동전은 빙글 */
.ico3d{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 12px 12px rgba(220,80,110,.28));animation:pop .7s cubic-bezier(.3,1.6,.5,1) both,float 3.4s .7s ease-in-out infinite}
.ico3d .beat{transform-box:fill-box;transform-origin:center;animation:beat 1.8s ease-in-out infinite}.ico3d .late{animation-delay:.3s}
.ico3d .spark{transform-box:fill-box;transform-origin:center;animation:twinkle 2.2s ease-in-out infinite}
.ico3d .coin{transform-box:fill-box;transform-origin:center;animation:flip 3s ease-in-out infinite}
@keyframes pop{from{transform:scale(.3) translateY(20px);opacity:0}}
@keyframes float{50%{transform:translateY(-7px) rotate(-3deg)}}
@keyframes beat{0%,60%,100%{transform:scale(1)}12%{transform:scale(1.12)}24%{transform:scale(.97)}36%{transform:scale(1.07)}}
@keyframes twinkle{50%{transform:scale(.4) rotate(45deg);opacity:.3}}
@keyframes flip{0%,40%,100%{transform:scaleX(1)}70%{transform:scaleX(-1)}}
@media (prefers-reduced-motion:reduce){.ico3d,.ico3d *{animation:none!important}}
.notice b{color:#fff}
.stage{display:inline-block;align-self:flex-start;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;background:var(--blush);color:var(--rose-dk)}
.stage.ok{background:var(--ok-bg);color:var(--ok)}
.pf-head{display:flex;flex-direction:column;align-items:center;gap:0;text-align:center}
.pf-head b{font-size:22px;font-weight:700;letter-spacing:-.01em}
.pf-head span,.pf-photo{font-size:13px;color:var(--muted)}
.pf-intro{font-size:15px;color:#4A4350;text-align:center}
.pf-style{font-size:14px;line-height:1.6;display:flex;flex-direction:column;gap:6px;background:#FFF6F9;border-radius:18px;padding:14px}
.pf-style b{color:var(--rose-dk);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:12px;border-radius:999px;padding:2px 10px;color:var(--rose-dk);background:var(--blush)}
/* 버튼: 분홍→빨강 그라데이션 알약(주), 회색 글자만(보조, 주 버튼 아래) */
.btn{font:inherit;font-weight:600;font-size:16px;letter-spacing:.02em;border:0;border-radius:999px;padding:15px;background:var(--grad);color:#fff;cursor:pointer;text-align:center;text-decoration:none;display:block;box-shadow:0 10px 22px rgba(238,95,132,.32)}
.btn:hover{filter:brightness(1.05)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.done{background:var(--blush);color:var(--rose-dk);box-shadow:none;cursor:default}
.btn:focus-visible{outline:3px solid rgba(238,95,132,.35);outline-offset:3px}
.pair{display:flex;flex-direction:column-reverse;gap:2px}
.btn.ghost{background:none;box-shadow:none;color:var(--muted);font-weight:500;padding:10px}.btn.ghost:hover{color:var(--ink);filter:none}
.btn.toss{background:#0064FF;box-shadow:0 10px 22px rgba(0,100,255,.25);margin:6px 0}
.contact{font-size:18px;font-weight:700;user-select:all}
/* 입금자명: 이름표와 닉네임 사이를 넉넉히 띄움 */
.payname{display:flex;justify-content:center;align-items:baseline;gap:28px}.payname>span:first-child{color:var(--muted);font-size:14px}
/* 꼭 봐야 할 한 줄: 소제목과 같은 분홍 형광펜 */
.hl{color:var(--ink);font-weight:600;padding:0 3px;background:linear-gradient(transparent 55%,#FBD6E0 55%,#FBD6E0 92%,transparent 92%)}
.acct{white-space:nowrap;text-align:center;font-size:min(16px,4.1vw);letter-spacing:-.01em}
.err{color:var(--rose-dk);font-size:13px;margin:0;text-align:center;min-height:1em}
.pf-more{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.pf-more dt{color:var(--muted)}
.pf-more dd{margin:0}
/* 긴 낱말도 칸 안에서 줄바꿈 */
.box,.pf-more dd{min-width:0;overflow-wrap:anywhere}
/* 사진: 보는 사람 닉네임을 흐리게 깔고, 길게 눌러 저장·끌어가기 막음 (캡처는 못 막음) */
.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ph{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:3/4;max-width:100%;background:var(--blush)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ph i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:15px;font-weight:600;color:rgba(255,255,255,.55);transform:rotate(-24deg);text-shadow:0 0 6px rgba(0,0,0,.25);pointer-events:none}
.sr{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.consent input{width:18px;height:18px;margin-top:3px;accent-color:var(--rose);flex:none}
.thumbs{display:flex;gap:8px}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:14px}
/* 4단계: 지난 단계 체크, 지금 단계는 그라데이션, 남은 단계는 연분홍 */
.steps{list-style:none;margin:0;padding:0;display:flex;justify-content:center;gap:18px;text-align:center;font-size:12px;color:var(--muted)}
.steps b{display:grid;place-items:center;width:26px;height:26px;margin:0 auto 3px;border-radius:50%;font-size:12px;background:var(--blush);color:var(--rose-dk)}
.steps .on{color:var(--rose-dk);font-weight:700}.steps .on b{background:var(--grad);color:#fff}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin-bottom:12px;background:#fff;border-radius:999px;box-shadow:var(--shadow)}.tabs button{background:none;border:0;border-radius:999px;padding:9px 0;font:inherit;font-size:15px;color:var(--muted);cursor:pointer}.tabs .on{background:var(--grad);color:#fff;font-weight:600}
.timer{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px 8px;margin:6px 0 0;padding:10px 12px;border-radius:16px;background:#FFF1F5;color:var(--rose-dk);font-size:13px;text-align:center}
.timer .t{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}.timer .why{flex-basis:100%;font-size:11px;opacity:.8;white-space:pre-line;line-height:1.5}
.timer.soon{background:#FFE4E4;color:#D7263D}
/* 3D 자명종: 초침이 1초마다 째깍, 6시간 안 남으면 따르릉 흔들림 */
.clock{width:40px;height:40px;flex:none;filter:drop-shadow(0 5px 6px rgba(220,80,110,.3))}
.clock svg{width:100%;height:100%;overflow:visible}
.clock .hand{transform-origin:50px 57px;animation:tick 60s steps(60) infinite}
.timer.soon .clock svg{transform-origin:50% 60%;animation:ring 2.4s ease-in-out infinite}
@keyframes ring{0%,70%,100%{transform:rotate(0)}74%,82%,90%{transform:rotate(-10deg)}78%,86%,94%{transform:rotate(10deg)}}
@keyframes tick{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.clock *{animation:none!important}}
.todo{white-space:pre-line;text-wrap:balance;font-weight:700;color:var(--ink);text-align:center;font-size:18px;line-height:1.45;letter-spacing:-.01em}
.more>summary{cursor:pointer;color:var(--muted);font-size:14px;list-style:none;text-align:center}
.more>summary::before{content:'＋ '}.more[open]>summary::before{content:'－ '}
.more[open]{display:flex;flex-direction:column;gap:10px}
.mine{border-top:1px solid var(--line);padding-top:20px}.mine>summary{font-size:15px;color:var(--ink);font-weight:600}
.more-open{display:flex;flex-direction:column;gap:10px}
.mine section>h2{background:none} /* 접힌 칸 안의 '내 사진' 제목은 형광펜 없이 */
</style>

<div class="page">
  <header><div class="script" id="hdrIco"></div><h1>내 <em>매칭</em> 페이지</h1><p class="muted">이 링크는 나만 볼 수 있어요.<br>다른 사람에게 보내지 마세요.</p></header>
  <p class="muted" id="loading" style="text-align:center">불러오는 중이에요…</p>
  <div id="view" hidden></div>
  <p class="err" id="err" role="alert"></p>
</div>

<script>
const $=id=>document.getElementById(id);
// 구글 시트 접수 주소(Apps Script 웹 앱). build_landing.sh가 채움. 비어 있으면 예시 화면
const ENDPOINT='https://script.google.com/macros/s/AKfycbxBDdde33r4IpmVHst1fU9zRLJaSHuyFfPqnT7X3yrmGYmWA3F1iidA8LLpwKTj1Fxtmw/exec';
const CHANNEL='https://pf.kakao.com/_wkCzX/chat';
// 신청 완료 화면은 me.html#토큰, 알림톡 버튼은 me.html?t=토큰 (버튼 주소엔 # 뒤 변수를 못 넣음)
const token=location.hash.slice(1)||new URLSearchParams(location.search).get('t')||'';
const el=(tag,props,...kids)=>{const e=Object.assign(document.createElement(tag),props||{});e.append(...kids.filter(Boolean));return e;};
let viewer='';
// 3D 느낌 아이콘: 이모지 대신 직접 그린 SVG(광택·입체 그라데이션) + CSS로 둥실·두근 움직임
const HEART='M50 84C22 65 10 50 10 35 10 22 20 12 32 12c8 0 14 4 18 11 4-7 10-11 18-11 12 0 22 10 22 23 0 15-12 30-40 49Z';
function ico(name){
  const k=name+Math.random().toString(36).slice(2,6); // 같은 화면에 여러 개여도 그라데이션 id가 안 겹치게
  const blur=`<filter id="b${k}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>`;
  const red=`<radialGradient id="r${k}" cx=".34" cy=".28" r=".8"><stop offset="0" stop-color="#FFD0DC"/><stop offset=".4" stop-color="#F2708F"/><stop offset=".75" stop-color="#D94468"/><stop offset="1" stop-color="#B03454"/></radialGradient>`;
  const coral=`<radialGradient id="c${k}" cx=".34" cy=".28" r=".8"><stop offset="0" stop-color="#FFE0CC"/><stop offset=".45" stop-color="#FF8A65"/><stop offset="1" stop-color="#D9482B"/></radialGradient>`;
  const gold=`<radialGradient id="g${k}" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFF6C2"/><stop offset=".45" stop-color="#FFCB3D"/><stop offset="1" stop-color="#D98E04"/></radialGradient>`;
  const heart=(fill,tf,cls='')=>`<g transform="${tf}"><g class="${cls}"><path d="${HEART}" fill="url(#${fill}${k})"/>
    <ellipse cx="32" cy="28" rx="9" ry="5" transform="rotate(-35 32 28)" fill="#fff" opacity=".85" filter="url(#b${k})"/>
    <ellipse cx="66" cy="62" rx="10" ry="4" transform="rotate(-40 66 62)" fill="#fff" opacity=".18" filter="url(#b${k})"/></g></g>`;
  const spark=(x,y,s,d)=>`<path class="spark" style="animation-delay:${d}s" d="M${x} ${y-s}Q${x} ${y} ${x+s} ${y}Q${x} ${y} ${x} ${y+s}Q${x} ${y} ${x-s} ${y}Q${x} ${y} ${x} ${y-s}Z" fill="#FFC93C"/>`;
  const art={
    mail:`<g transform="rotate(-6 50 55)"><rect x="12" y="30" width="76" height="54" rx="11" fill="url(#e${k})"/>
      <path d="M16 80 50 56 84 80" fill="none" stroke="#F4B6C9" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M12 41q0-11 11-11h54q11 0 11 11L55 64q-5 4-10 0Z" fill="url(#f${k})"/>
      <rect x="18" y="33" width="40" height="5" rx="2.5" fill="#fff" opacity=".7"/></g>
      ${heart('r','translate(35 46) scale(.32)','beat')}${spark(86,22,6,0)}${spark(14,20,4,.7)}`,
    heart:`${heart('r','translate(4 6) scale(.92)','beat')}${spark(86,18,7,0)}${spark(12,74,4,.8)}${spark(90,62,4,1.3)}`,
    hearts:`${heart('c','translate(40 2) scale(.56)','beat late')}${heart('r','translate(0 20) scale(.74)','beat')}${spark(88,72,5,.4)}`,
    card:`<g transform="rotate(-12 46 50)"><rect x="10" y="26" width="68" height="46" rx="9" fill="url(#p${k})"/>
      <rect x="10" y="36" width="68" height="8" fill="#000" opacity=".16"/>
      <rect x="18" y="51" width="13" height="10" rx="2.5" fill="url(#g${k})"/>
      <rect x="14" y="29" width="44" height="4" rx="2" fill="#fff" opacity=".45"/></g>
      <g class="coin"><circle cx="72" cy="70" r="16" fill="url(#g${k})"/><circle cx="72" cy="70" r="11.5" fill="none" stroke="#C98200" stroke-width="1.5" opacity=".55"/>
      <text x="72" y="75.5" text-anchor="middle" font-size="15" font-weight="800" fill="#B26F00" font-family="Gowun Dodum,sans-serif">₩</text>
      <ellipse cx="65" cy="62" rx="5" ry="3" transform="rotate(-35 65 62)" fill="#fff" opacity=".8" filter="url(#b${k})"/></g>`,
    phone:`<g transform="rotate(-8 50 50)"><rect x="27" y="8" width="46" height="84" rx="12" fill="url(#d${k})"/>
      <rect x="31" y="15" width="38" height="70" rx="8" fill="url(#s${k})"/>
      <path d="M36 32q0-6 6-6h16q6 0 6 6v8q0 6-6 6H46l-6 5v-5q-4-1-4-6Z" fill="#fff"/>
      <rect x="40" y="56" width="22" height="4" rx="2" fill="#fff" opacity=".8"/><rect x="40" y="64" width="15" height="4" rx="2" fill="#fff" opacity=".6"/>
      <path d="M30 12 42 12 30 40Z" fill="#fff" opacity=".12"/></g>

  if(m&&d.confirmed&&d.likedMe.length){

    el('p',{className:'muted',textContent:'상대에게는 이렇게 보여요.'}),mine,photoBox(d.me)));
}
